<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <title>Directional Audio Compass</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="app">
            <div class="stage">
                <canvas id="glow" class="glow" aria-hidden="true"></canvas>
                <canvas id="glow2" class="glow2" aria-hidden="true"></canvas>
                <canvas id="cv" aria-hidden="true"></canvas>
                <header class="bar">
                    <span class="brand">Directional Audio Compass</span>
                    <button class="link" id="detBtn" aria-expanded="false" aria-controls="details">
                        Details
                    </button>
                    <span class="live" id="conn"><i></i><span id="connText">Connecting</span></span>
                </header>
                <div class="details" id="details" hidden>
                    <div><span>Level</span><b id="d-level">—</b></div>
                    <div><span>Turning</span><b id="d-rate">—</b></div>
                    <div><span>Loudness trend</span><b id="d-trend">—</b></div>
                    <div><span>Vehicle score</span><b id="d-prob">—</b></div>
                    <div><span>Mode</span><b id="d-mode">—</b></div>
                </div>
            </div>
        </div>
        <div class="sr" aria-live="polite" id="live"></div>
        <script src="js/config.js"></script>
        <script src="js/feed.js"></script>
        <script src="js/readouts.js"></script>
        <script src="js/compass.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
